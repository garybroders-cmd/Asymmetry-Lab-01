
!
hostname iVOS-7
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.255.0.7 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 no shutdown
 description to vIOS-3
 ip address 10.0.37.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 description to vIOS-1
 ip address 10.0.17.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
!
router ospf 1
 router-id 10.255.0.7
!
